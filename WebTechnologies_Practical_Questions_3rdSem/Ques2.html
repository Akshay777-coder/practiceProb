<!-- Question 2. HTML Tables and Lists: Create a webpage displaying a student marksheet using an HTML table. Also demonstrate ordered lists and unordered lists. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2</title>
</head>
<body>
    <h2>Student Marksheet</h2>
    <table border="1">
        <tr>
            <th>Subject</th>
            <th>Marks</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>Physics</td>
            <td>85</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Chemistry</td>
            <td>90</td>
            <td>A+</td>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>88</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Biology</td>
            <td>92</td>
            <td>A+</td>
        </tr>
    </table>

    <h2>Ordered List of Hobbies</h2>
    <ol>
        <li>Readings</li>
        <li>Coding</li>
        <li>Sports</li>
    </ol>

    <h2>Unordered List of Favorite Foods</h2>
    <ul>
        <li>Saag Roti</li>
        <li>Palak Paneer</li>
        <li>Chole Bhature</li>
    </ul>
</body>
</html>
