<!-- Question 4. CSS Styling: Create a webpage demonstrating inline, internal, and external CSS. Apply different colors, fonts, backgrounds, borders, and text alignment. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 4</title>
    <link rel="stylesheet" href="Ques4.css">
    <style>
        #p1 {
            color: blue;
            font-family: 'Courier New', Courier, monospace;
            background-color: lightyellow;
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Inline CSS</h2>
    <p style="color: white; font-family: Arial, sans-serif; background-color: lightblue; border: 1px solid black; text-align: center;">This is a paragraph with inline CSS.</p>

    <h2>Internal CSS</h2>
    <p id="p1">This is a paragraph with internal CSS.</p>

    <h2>External CSS</h2>
    <p id="p2">This is a paragraph with external CSS.</p>
    
</body>
</html>
