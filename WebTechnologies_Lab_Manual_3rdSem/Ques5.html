<!--Question 5. Responsive Navigation Bar: Design a responsive navigation bar using HTML and CSS that displays menu items horizontally on desktop screens and adapts to mobile screen sizes. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 5</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        /* Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 15px 8%;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
        }

        /* Navigation Links */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #00d4ff;
        }

        /* Hide checkbox and hamburger */
        #menu-toggle {
            display: none;
        }

        .hamburger {
            display: none;
            font-size: 28px;
            cursor: pointer;
        }

        /* Mobile Responsive Design */
        @media screen and (max-width: 768px) {

            .hamburger {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                background: #222;
                text-align: center;
                gap: 0;
            }

            .nav-links li {
                padding: 15px;
                border-top: 1px solid #444;
            }

            #menu-toggle:checked~.nav-links {
                display: flex;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">MyWebsite</div>

        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="hamburger">
            ☰
        </label>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <main>
        <h1>Welcome to My Website</h1>
        <p>I Built a Responsive Navigation Bar using HTML and CSS.</p>
    </main>

</body>

</html>
