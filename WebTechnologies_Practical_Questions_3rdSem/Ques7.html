<!-- 7. Form Validation: Create a student registration form and validate the name, email, mobile number, and password using JavaScript. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 7</title>
</head>
<body>
    <h2>Student Registration Form</h2>
    <form id="registration-form" onsubmit="return validateForm()" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="mobile">Mobile Number:</label>
        <input type="text" id="mobile" name="mobile" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <input type="submit" value="Register">

        <script>
            function validateForm() {
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const mobile = document.getElementById('mobile').value;
                const password = document.getElementById('password').value;
                
                // Validate name (only letters and spaces)
                const nameRegex = /^[A-Za-z\s]+$/;
                if(!nameRegex.test(name)) {
                    alert('Please enter a valid name (only letters and spaces).');
                    return false;
                }

                // Validate email (basic validation)
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if(!emailRegex.test(email)) {
                    alert('Please enter a valid email address.');
                    return false;
                }

                // Validate mobile number (10 digits)
                const mobileRegex = /^\d{10}$/;
                if(!mobileRegex.test(mobile)) {
                    alert('Please enter a valid 10-digit mobile number.');
                    return false;
                }

                // Validate password (at least 6 characters)
                if(password.length < 6) {
                    alert('Password must be at least 6 characters long.');
                    return false;
                }

                return true;
            }
        </script>
    </form>
</body>
</html>
